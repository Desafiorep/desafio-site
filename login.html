<style>
  :root {
    --navy:#0B2B37; --navy-900:#114355; --sky-50:#EEF7FF; --sky-300:#91CAFF; --sky-500:#308FE8;
    --neutral-0:#FFFFFF; --neutral-200:#D6DCE1; --neutral-500:#818E98; --neutral-700:#4F616D;
    --neutral-1000:#14232E; --red-700:#9B2A22;
    --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--sky-50); color:var(--neutral-1000); font:500 15px/1.5 var(--font); padding:24px; }
  .cartao { width:100%; max-width:420px; background:var(--neutral-0); border:1px solid var(--neutral-200);
    border-radius:16px; padding:40px 32px; text-align:center;
    box-shadow:0 2px 6px rgba(11,43,55,.06), 0 0 1px rgba(11,43,55,.12); }
  .marca { display:block; height:30px; margin:0 auto 28px; color:var(--navy); }
  h1 { font-size:22px; line-height:30px; font-weight:700; letter-spacing:-.01em; margin:0 0 6px; }
  p.ajuda { margin:0 0 24px; color:var(--neutral-700); font-size:14px; line-height:20px; }
  label { display:block; text-align:left; font-size:12px; font-weight:600; text-transform:uppercase;
    letter-spacing:.06em; color:var(--neutral-700); margin-bottom:6px; }
  input { width:100%; height:44px; padding:0 14px; border-radius:8px; border:1px solid var(--neutral-500);
    background:var(--neutral-0); color:var(--neutral-1000); font:600 16px var(--font); }
  input:focus { outline:none; border-color:var(--sky-500);
    box-shadow:0 0 0 2px var(--neutral-0), 0 0 0 4px var(--sky-500); }
  button { width:100%; height:44px; margin-top:16px; border:0; border-radius:8px; cursor:pointer;
    background:var(--navy); color:#fff; font:600 15px var(--font);
    transition:background 150ms cubic-bezier(.16,1,.3,1); }
  button:hover { background:var(--navy-900); }
  button[disabled] { opacity:.6; cursor:progress; }
  .erro { min-height:20px; margin-top:12px; color:var(--red-700); font-size:13px; font-weight:600; }
  .rodape { margin-top:24px; font-size:12px; color:var(--neutral-500); }
  .rodape a { color:var(--neutral-700); }
</style>

    <h1>Painel Comercial</h1>
    <p class="ajuda">Área interna da equipe. Digite a senha para entrar.</p>

    <form id="form" autocomplete="off">
      <label for="senha">Senha de acesso</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password"
             required autofocus aria-describedby="erro" />
      <button type="submit" id="botao">Entrar</button>
      <div class="erro" id="erro" role="alert"></div>
    </form>

    <div class="rodape"><a href="/">Voltar para o site</a></div>
  </main>

<script>
  const form = document.getElementById('form');
  const campo = document.getElementById('senha');
  const botao = document.getElementById('botao');
  const erro = document.getElementById('erro');

  // para onde voltar depois de entrar (o middleware manda ?de=/painel)
  const destino = new URLSearchParams(location.search).get('de') || '/painel';

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erro.textContent = '';
    botao.disabled = true;
    botao.textContent = 'Entrando…';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha: campo.value }),
      });
      if (r.ok) {
        // caminho relativo apenas, para não virar redirecionamento aberto
        location.href = destino.startsWith('/') ? destino : '/painel';
        return;
      }
      const dados = await r.json().catch(() => null);
      erro.textContent = (dados && dados.erro)
        ? dados.erro
        : `Falha ao entrar (código ${r.status}). Avise quem cuida do painel.`;
    } catch {
      erro.textContent = 'Falha de conexão. Verifique a internet e tente de novo.';
    }
    campo.value = '';
    campo.focus();
    botao.disabled = false;
    botao.textContent = 'Entrar';
  });
</script>
