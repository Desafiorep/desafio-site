/* ===========================================================================
   Desafio Design System — tokens de tokens/*.css do projeto
   "Desafio Design System" (claude.ai/design). O shell segue o template
   templates/painel-comercial/PainelComercial.dc.html: sidebar navy fixa,
   topbar de 64px, conteúdo sobre Ice White.
   =========================================================================== */
:root {
  color-scheme: light !important;

  /* rampas primitivas */
  --navy-50:#F3F9FC; --navy-100:#E3F2F8; --navy-800:#175E78; --navy-900:#114355;
  --navy-1000:#0B2B37; --navy-1100:#071C24;
  --sky-50:#EEF7FF; --sky-100:#DDEEFE; --sky-200:#BBDCFB; --sky-300:#91CAFF;
  --sky-400:#5FABF2; --sky-500:#308FE8; --sky-600:#2178CA; --sky-700:#22609B;
  --sky-800:#1F496F; --sky-900:#19344D;
  --neutral-0:#FFFFFF; --neutral-50:#F6F8F9; --neutral-100:#EAEEF0; --neutral-200:#D6DCE1;
  --neutral-300:#BDC6CC; --neutral-400:#9FAAB2; --neutral-500:#818E98; --neutral-600:#677883;
  --neutral-700:#4F616D; --neutral-800:#384A57; --neutral-900:#243642; --neutral-1000:#14232E;
  --clay-100:#F6EAE4; --clay-200:#E9D0C4; --clay-400:#CF9B81; --clay-500:#C07B59; --clay-700:#865137;
  --green-100:#E3F7ED; --green-400:#80D0A8; --green-800:#206F47;
  --amber-100:#FEF3DD; --amber-500:#F4AF25; --amber-700:#B17A0B; --amber-800:#815A0E;
  --red-100:#FBE1DF; --red-600:#C53026; --red-700:#9B2A22;
  --purple-100:#ECE1F9; --purple-400:#A279D8; --purple-600:#6D3BB0; --purple-700:#58318C;

  /* semânticos — tema claro */
  --surface:var(--neutral-0); --surface-sunken:var(--sky-50); --surface-brand:var(--navy-1000);
  --bg-neutral-subtle:var(--neutral-50); --bg-neutral:var(--neutral-100);
  --bg-brand-subtlest:var(--sky-50); --bg-brand-subtle:var(--sky-100);
  --bg-selected:var(--sky-100); --bg-input:var(--neutral-0); --bg-input-hovered:var(--neutral-50);
  --bg-success-subtle:var(--green-100); --bg-warning-subtle:var(--amber-100);
  --bg-danger-subtle:var(--red-100); --bg-ai-subtle:var(--purple-100);
  --bg-accent-warm:var(--clay-100);
  --text:var(--neutral-1000); --text-subtle:var(--neutral-700); --text-subtlest:var(--neutral-600);
  --text-inverse:var(--neutral-0); --text-link:var(--sky-700);
  --text-success:var(--green-800); --text-warning:var(--amber-800); --text-danger:var(--red-700);
  --text-ai:var(--purple-700); --text-selected:var(--sky-800);
  --icon:var(--neutral-700); --icon-subtle:var(--neutral-600);
  --border:var(--neutral-200); --border-bold:var(--neutral-300); --border-input:var(--neutral-500);
  --border-focus:var(--sky-500); --border-ai:var(--purple-400); --border-selected:var(--sky-600);
  --blanket:rgba(11,43,55,0.60);

  /* séries de gráfico — ordem fixa do DS */
  --chart-1:#22609B; --chart-2:#91CAFF; --chart-3:#206F47;
  --chart-4:#F4AF25; --chart-5:#C07B59; --chart-6:#6D3BB0;
  --chart-grid:#EAEEF0; --chart-axis:#818E98;
  /* rampa ordinal do funil, derivada da rampa Sky */
  --ramp-1:#BBDCFB; --ramp-2:#91CAFF; --ramp-3:#5FABF2;
  --ramp-4:#2178CA; --ramp-5:#22609B; --ramp-6:#1F496F;

  /* identidade de cada representada (só o marcador da sidebar) */
  --rep-3m:var(--sky-300); --rep-prysmian:var(--clay-200); --rep-wd-40:var(--green-400);

  --shadow-raised:0 1px 2px rgba(11,43,55,.08), 0 0 1px rgba(11,43,55,.10);
  --shadow-card:0 2px 6px rgba(11,43,55,.06), 0 0 1px rgba(11,43,55,.12);
  --shadow-overlay:0 8px 24px rgba(11,43,55,.12), 0 0 1px rgba(11,43,55,.14);
  --shadow-modal:0 24px 56px rgba(11,43,55,.20), 0 0 1px rgba(11,43,55,.16);

  --space-4:.25rem; --space-8:.5rem; --space-12:.75rem; --space-16:1rem;
  --space-20:1.25rem; --space-24:1.5rem; --space-32:2rem; --space-40:2.5rem;
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px;
  --radius-pill:999px;
  --sidebar-w:240px; --topbar-h:64px;
  --font-sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-display:'Mokoko',Georgia,'Times New Roman',serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --dur-instant:100ms; --dur-fast:150ms; --ease-out:cubic-bezier(.16,1,.3,1);
}
* { box-sizing:border-box; }
body { margin:0; background:var(--surface-sunken); color:var(--text);
  font:500 14px/20px var(--font-sans); -webkit-font-smoothing:antialiased; }
a { color:var(--text-link); }

/* ---------- shell ---------- */
.app { display:flex; min-height:100vh; }
.sidebar { width:var(--sidebar-w); min-width:var(--sidebar-w); background:var(--surface-brand);
  color:#fff; display:flex; flex-direction:column; padding:var(--space-16) var(--space-12);
  gap:var(--space-4); position:sticky; top:0; height:100vh; overflow-y:auto; }
.sidebar .brand { display:flex; align-items:center; padding:var(--space-8) var(--space-8) var(--space-24); }
.sidebar .logo { height:24px; width:auto; color:#fff; }
.navlink { display:flex; align-items:center; gap:var(--space-8); height:40px; padding:0 var(--space-12);
  border-radius:var(--radius-md); text-decoration:none; color:var(--sky-200);
  font-size:14px; font-weight:500; border:0; background:transparent; width:100%;
  text-align:left; cursor:pointer; font-family:inherit;
  transition:background var(--dur-instant) var(--ease-out), color var(--dur-instant) var(--ease-out); }
.navlink:hover { background:rgba(255,255,255,.10); color:#fff; }
.navlink.on { background:rgba(255,255,255,.20); color:#fff; font-weight:600; }
.navlink .ico { width:16px; height:16px; flex:none; opacity:.9; }
.navlink .dot { width:8px; height:8px; border-radius:var(--radius-pill); flex:none; }
.navlink .lk { width:13px; height:13px; margin-left:auto; opacity:.65; flex:none; }
.navgroup { padding:var(--space-16) var(--space-8) var(--space-4); font-size:11px; line-height:16px;
  letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:var(--sky-300); }
.subnav { display:flex; flex-direction:column; gap:2px; margin:2px 0 var(--space-8); }
.subnav .navlink { height:32px; font-size:13px; padding-left:var(--space-32); color:rgba(255,255,255,.62); }
.subnav .navlink:hover { color:#fff; }
.subnav .navlink.on { background:transparent; color:#fff; font-weight:600;
  box-shadow:inset 2px 0 0 var(--sky-300); border-radius:0 var(--radius-md) var(--radius-md) 0; }
.sidefoot { margin-top:auto; padding:var(--space-16) var(--space-8) var(--space-4);
  border-top:1px solid rgba(255,255,255,.12); font-size:11px; line-height:16px; color:var(--sky-200); }
.sidefoot b { display:block; font-weight:600; color:#fff; font-size:12px; }

.shell { flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar { height:var(--topbar-h); display:flex; align-items:center; gap:var(--space-16);
  padding:0 var(--space-24); background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:500; }
.topbar h1 { margin:0; font-size:20px; line-height:28px; font-weight:700; letter-spacing:-.01em; }
.topbar .sub { font-size:12px; line-height:16px; color:var(--text-subtle); margin-top:1px; }
.topbar .acoes { margin-left:auto; display:flex; align-items:center; gap:var(--space-12); }
main.content { flex:1; padding:var(--space-24); display:flex; flex-direction:column;
  gap:var(--space-24); min-width:0; }
.menubtn { display:none; }
@media (max-width:1000px) {
  .sidebar { position:fixed; z-index:600; transform:translateX(-100%);
    transition:transform var(--dur-fast) var(--ease-out); }
  .sidebar.aberta { transform:translateX(0); box-shadow:var(--shadow-modal); }
  .menubtn { display:inline-flex; }
  main.content { padding:var(--space-16); }
}

/* ---------- botões (DS: Button) ---------- */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-8);
  height:32px; padding:0 var(--space-12); border-radius:var(--radius-sm); font:600 14px var(--font-sans);
  border:1px solid transparent; cursor:pointer; white-space:nowrap;
  transition:background var(--dur-instant) var(--ease-out), border-color var(--dur-instant) var(--ease-out); }
.btn .ico { width:15px; height:15px; }
.btn-primary { background:var(--navy-1000); color:#fff; }
.btn-primary:hover { background:var(--navy-900); }
.btn-secondary { background:var(--surface); color:var(--text); border-color:var(--border-bold); }
.btn-secondary:hover { background:var(--bg-neutral-subtle); }
.btn-subtle { background:transparent; color:var(--text-subtle); }
.btn-subtle:hover { background:var(--bg-neutral); color:var(--text); }
.btn:focus-visible, .navlink:focus-visible, .campo:focus-visible, select.campo:focus,
input.campo:focus, .info:focus-visible, .insb:focus-visible, .th-sort:focus-visible {
  outline:none; box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--border-focus); }

/* ---------- cartões e seções ---------- */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-raised); }
.card-pad { padding:var(--space-20); }
.card-head { padding:var(--space-16) var(--space-20); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:var(--space-12); flex-wrap:wrap; }
.card-head h2 { margin:0; font-size:16px; line-height:24px; font-weight:600; letter-spacing:-.005em;
  display:flex; align-items:center; gap:var(--space-8); }
.card-head p { margin:2px 0 0; font-size:12px; line-height:16px; color:var(--text-subtle); }
.card-head .dir { margin-left:auto; display:flex; align-items:center; gap:var(--space-8); flex-wrap:wrap; }
.sec { display:flex; flex-direction:column; gap:var(--space-12); }
.sec-head { display:flex; align-items:baseline; gap:var(--space-8); flex-wrap:wrap; }
.sec-head h2 { margin:0; font-size:16px; line-height:24px; font-weight:600; letter-spacing:-.005em; }
.sec-head .hint { font-size:12px; color:var(--text-subtle); }
.cols2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-16); }
@media (max-width:1100px){ .cols2 { grid-template-columns:1fr; } }

/* ---------- KPIs (DS: metric) ---------- */
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:var(--space-16); }
.kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:var(--space-16); box-shadow:var(--shadow-raised); }
.kpi .lbl { font-size:14px; line-height:20px; font-weight:500; color:var(--text-subtle);
  display:flex; align-items:center; gap:var(--space-4); }
.kpi .linha { display:flex; align-items:baseline; gap:var(--space-8); margin-top:var(--space-4); }
.kpi .val { font-size:24px; line-height:32px; font-weight:800; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; }
.kpi .cap { font-size:12px; line-height:16px; color:var(--text-subtlest); margin-top:var(--space-4); }
.delta { font-size:14px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
.delta.up { color:var(--text-success); } .delta.down { color:var(--text-danger); }

/* ---------- lozenge / tag (DS: Lozenge, Tag) ---------- */

/* ---------------- popover ---------------- */
const pop = document.getElementById('pop');
function showPop(el, texto, tipo){
  pop.className = 'pop' + (tipo==='ins' ? ' ins' : '');
  pop.innerHTML = `<div class="pt">${tipo==='ins'?'Insight':'De onde vem este número'}</div>${esc(texto)}`;
  pop.style.display='block';
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = Math.min(Math.max(8, r.left), innerWidth - pw - 8);
  let y = r.bottom + 8; if (y + ph > innerHeight - 8) y = r.top - ph - 8;
  pop.style.left = x+'px'; pop.style.top = Math.max(8,y)+'px';
}
function hidePop(){ pop.style.display='none'; }
document.addEventListener('mouseover', e=>{
  const t = e.target.closest('[data-tip],[data-ins]');
  if (t) showPop(t, t.dataset.tip || t.dataset.ins, t.dataset.ins?'ins':'tip');
});
document.addEventListener('mouseout', e=>{
  if (e.target.closest('[data-tip],[data-ins]')) hidePop();
});
document.addEventListener('focusin', e=>{
  const t = e.target.closest('[data-tip],[data-ins]');
  if (t) showPop(t, t.dataset.tip || t.dataset.ins, t.dataset.ins?'ins':'tip'); else hidePop();
});

/* ---------------- modal ---------------- */
const overlay = document.getElementById('overlay'), modal = document.getElementById('modal');
function openModal(titulo, sub, corpo){
  modal.innerHTML = `<div class="mhead"><button id="mclose" aria-label="Fechar">${ICON.fechar}</button>
    <h3>${titulo}</h3>${sub?`<div class="msub">${sub}</div>`:''}</div><div class="mbody">${corpo}</div>`;
  overlay.style.display='block'; modal.style.display='block';
  modal.scrollTop = 0;
  document.getElementById('mclose').onclick = closeModal;
}
function closeModal(){ overlay.style.display='none'; modal.style.display='none'; }
overlay.addEventListener('click', closeModal);

/* ---------------- componentes ---------------- */
function info(t){ return t?`<button class="info" data-tip="${esc(t)}" aria-label="De onde vem este número"><i class="ic">i</i></button>`:''; }
function insight(t){ return t?`<button class="insb" data-ins="${esc(t)}" aria-label="Insight">${ICON.brilho}</button>`:''; }
function kpi(lbl, val, cap, tt, ins, delta){
  return `<div class="kpi"><div class="lbl"><span>${esc(lbl)}</span>${info(tt)}${insight(ins)}</div>
    <div class="linha"><span class="val">${val}</span>${delta||''}</div>
    ${cap?`<div class="cap">${esc(cap)}</div>`:''}</div>`;
}
function deltaHTML(v, rot){
  if (v==null) return '';
  const up = v>=0;
  return `<span class="delta ${up?'up':'down'}">${up?'↑':'↓'} ${Math.abs(v).toLocaleString('pt-BR',{maximumFractionDigits:0})}%${rot?' '+rot:''}</span>`;
}
function loz(txt, tom){ return `<span class="loz ${tom||''}">${esc(txt)}</span>`; }
const TOM_SIT = {'Em dia':'suc','Em risco':'warn','Inativo':'','Prospecção':'info',
                 'No ritmo':'suc','Atrás':'warn','À frente':'info'};
const TOM_TEMP = {QUENTE:'dang', ALTA:'dang', MORNO:'warn', MEDIA:'warn',
                  FRIO:'info', BAIXA:'info', GLACIAL:''};
function tendenciaHTML(t){
  if (t==null) return '<span style="color:var(--text-subtlest)">—</span>';
  const up = t>=0;
  return `<span class="delta ${up?'up':'down'}">${up?'↑':'↓'} ${Math.abs(t).toLocaleString('pt-BR')}%</span>`;
}
function spark(vals, w=88, h=22, cor){
  const max = Math.max(1, ...vals), bw = w/vals.length;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">` +
    vals.map((v,i)=>{ const bh = Math.max(v>0?2:0, h*v/max);
      return `<rect x="${(i*bw+1).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1" fill="${cor||'var(--chart-1)'}"/>`;
    }).join('') + `</svg>`;
}
function ai(titulo, texto){
  return `<section class="ai"><span class="rail"></span><div>
    <div class="eyebrow">Destaque do período</div>
    <h3>${esc(titulo)}</h3><p>${esc(texto)}</p></div></section>`;
}

/* tabela: cab[i] = {t, num, trunc, tip, sort:'chave'}
   linhas[i] = {cels:[...], attrs:'...', busca:'...', cat:{campo:valor}, ord:{chave:num}} */
function tabela(id, cab, linhas, vazio){
  if (!linhas.length) return `<div class="vazio"><b>Nada por aqui</b>${esc(vazio)}</div>`;
  const th = cab.map((c,i)=>{
    const inner = c.sort
      ? `<button class="th-sort" data-sort="${c.sort}" data-alvo="${id}">${esc(c.t)}<span class="arw">▲</span></button>`
      : esc(c.t);
    return `<th class="${c.num?'num':''}">${inner}${c.tip?' '+info(c.tip):''}</th>`;
  }).join('');
  const tr = linhas.map(l=>{
    const cats = Object.entries(l.cat||{}).map(([k,v])=>`data-c-${k}="${esc(v)}"`).join(' ');
    const ords = Object.entries(l.ord||{}).map(([k,v])=>`data-s-${k}="${esc(ordVal(v))}"`).join(' ');
    const cels = l.cels.map((c,i)=>`<td class="${cab[i].num?'num':''} ${cab[i].trunc?'trunc':''}" ${cab[i].trunc?`title="${esc(c.raw??(typeof c==='string'?c:''))}"`:''}>${c&&c.html!==undefined?c.html:esc(c)}</td>`).join('');
    return `<tr ${l.attrs||''} data-busca="${esc(normU(l.busca||''))}" ${cats} ${ords}>${cels}</tr>`;
  }).join('');
  return `<div class="tbl-wrap" data-tabela="${id}"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>
    <div class="vazio" data-semresultado hidden><b>Nenhum resultado</b>Ajuste a busca ou os filtros acima.</div></div>`;
}

/* barra de filtros: campos = [{tipo:'busca'|'select'|'chip', ...}] */
function filtros(id, campos){
  const html = campos.map(c=>{
    if (c.tipo==='busca')
      return `<input class="campo" type="search" data-f="busca" data-alvo="${id}" placeholder="${esc(c.ph||'Buscar…')}" aria-label="${esc(c.ph||'Buscar')}">`;
    if (c.tipo==='select')
      return `<select class="campo" data-f="${c.campo}" data-alvo="${id}" aria-label="${esc(c.label)}">
        <option value="">${esc(c.label)}: todos</option>
        ${c.opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
    if (c.tipo==='chip')
      return `<button class="chipbtn" data-f="chip" data-campo="${c.campo}" data-valor="${esc(c.valor)}" data-alvo="${id}">${esc(c.label)}</button>`;
    return '';
  }).join('');
  return `<div class="filtros" data-filtros="${id}">${html}<span class="contagem" data-contagem="${id}"></span></div>`;
}

function aplicarFiltros(id){
  const wrap = document.querySelector(`[data-tabela="${id}"]`);
  const bar = document.querySelector(`[data-filtros="${id}"]`);
  if (!wrap || !bar) return;
  const q = normU(bar.querySelector('[data-f="busca"]')?.value || '');
  const selects = [...bar.querySelectorAll('select[data-f]')];
  const chips = [...bar.querySelectorAll('.chipbtn.on')];
  const rows = [...wrap.querySelectorAll('tbody tr')];
  let vis = 0;
  rows.forEach(tr=>{
    let ok = !q || (tr.getAttribute('data-busca')||'').includes(q);
    if (ok) for (const s of selects) {
      if (s.value && tr.getAttribute('data-c-'+s.dataset.f) !== s.value) { ok = false; break; }
    }
    if (ok) for (const c of chips) {
      if (tr.getAttribute('data-c-'+c.dataset.campo) !== c.dataset.valor) { ok = false; break; }
    }
    tr.hidden = !ok; if (ok) vis++;
  });
  const cont = document.querySelector(`[data-contagem="${id}"]`);
  if (cont) cont.textContent = vis === rows.length ? `${rows.length} ${rows.length===1?'item':'itens'}`
                                                   : `${vis} de ${rows.length}`;
  const vazio = wrap.querySelector('[data-semresultado]');
  if (vazio) vazio.hidden = vis > 0;
}

function ordenar(id, chave, th){
  const wrap = document.querySelector(`[data-tabela="${id}"]`);
  const tb = wrap.querySelector('tbody');
  const asc = !th.classList.contains('asc');
  wrap.querySelectorAll('.th-sort').forEach(b=>b.classList.remove('asc','desc'));
  th.classList.add(asc?'asc':'desc');
  const rows = [...tb.querySelectorAll('tr')];
  rows.sort((a,b)=>{
    const va = a.getAttribute('data-s-'+chave), vb = b.getAttribute('data-s-'+chave);
    const na = va===null||va==='', nb = vb===null||vb==='';
    if (na && nb) return 0; if (na) return 1; if (nb) return -1;
    const fa = parseFloat(va), fb = parseFloat(vb);
    if (!isNaN(fa) && !isNaN(fb)) return asc ? fa-fb : fb-fa;
    return asc ? String(va).localeCompare(String(vb),'pt-BR') : String(vb).localeCompare(String(va),'pt-BR');
  }).forEach(tr=>tb.appendChild(tr));
}

document.addEventListener('input', e=>{
  const f = e.target.closest('[data-f="busca"]'); if (f) aplicarFiltros(f.dataset.alvo);
});
document.addEventListener('change', e=>{
  const s = e.target.closest('select[data-f]'); if (s) aplicarFiltros(s.dataset.alvo);
});
document.addEventListener('click', e=>{
  const c = e.target.closest('.chipbtn');
  if (c) { c.classList.toggle('on'); aplicarFiltros(c.dataset.alvo); return; }
  const th = e.target.closest('.th-sort');
  if (th) { ordenar(th.dataset.alvo, th.dataset.sort, th); return; }
});

/* ---------------- gráfico mensal ---------------- */
function chartMeses(meses, id, n){
  const dados = n ? meses.slice(-n) : meses;
  const W=960, H=260, padL=64, padR=12, padT=16, padB=30;
  const iw=W-padL-padR, ih=H-padT-padB;
  const max = Math.max(1, ...dados.map(m=>Math.max(m.pedidos,m.orcamentos)));
  const niceMax = (()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));return Math.ceil(max/p)*p;})();
  const y = v => padT + ih*(1 - v/niceMax);
  const grp = iw/dados.length, bw = Math.min(20, grp*0.32);
  let g='';
  for (let i=0;i<=4;i++){
    const v=niceMax*i/4, yy=y(v);
    g+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--chart-grid)"/>`;
    g+=`<text x="${padL-10}" y="${yy+4}" text-anchor="end" font-size="11" font-weight="600" fill="var(--chart-axis)">${compact(v).replace('R$ ','')}</text>`;
  }
  let bars='';
  dados.forEach((m,i)=>{
    const cx = padL + grp*i + grp/2;
    const ho = Math.max(ih-(y(m.orcamentos)-padT), m.orcamentos>0?2:0);
    const hp = Math.max(ih-(y(m.pedidos)-padT), m.pedidos>0?2:0);
    bars+=`<g class="mgrp" data-i="${i}">
      <rect x="${cx-bw-1}" y="${y(m.orcamentos)}" width="${bw}" height="${ho}" rx="3" fill="var(--chart-2)" stroke="var(--sky-500)" stroke-width="1"/>
      <rect x="${cx+1}" y="${y(m.pedidos)}" width="${bw}" height="${hp}" rx="3" fill="var(--chart-1)"/>
      <rect x="${padL+grp*i}" y="${padT}" width="${grp}" height="${ih}" fill="transparent"/>
    </g>
    <text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--chart-axis)">${m.label}</text>`;
  });
  return `<svg id="${id}" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:600px;display:block">
    ${g}<line x1="${padL}" y1="${padT+ih}" x2="${W-padR}" y2="${padT+ih}" stroke="var(--border-bold)"/>${bars}</svg>`;
}
function bindChart(id, meses, aba, n){
  const svg = document.getElementById(id); if (!svg) return;
  const dados = n ? meses.slice(-n) : meses;
  svg.querySelectorAll('.mgrp').forEach(gr=>{
    const m = dados[+gr.dataset.i];
    gr.addEventListener('mousemove', e=>{
      pop.className='pop'; pop.style.display='block';
      pop.innerHTML=`<div class="pt">${esc(m.label)}</div>Orçamentos: <b>${fmt(m.orcamentos)}</b> (${m.orcamentos_qtd})<br>Pedidos: <b>${fmt(m.pedidos)}</b> (${m.pedidos_qtd})`;
      pop.style.left=Math.min(e.clientX+14, innerWidth-260)+'px';
      pop.style.top=(e.clientY+14)+'px';
    });
    gr.addEventListener('mouseleave', hidePop);
    gr.addEventListener('click', ()=>{ hidePop(); openMes(aba, m); });
  });
}

/* ---------------- views ---------------- */
function funnelHTML(f){
  const max = Math.max(1, ...f.etapas.map(e=>e.valor));
  const ramps=['var(--ramp-1)','var(--ramp-2)','var(--ramp-3)','var(--ramp-4)','var(--ramp-5)','var(--ramp-6)'];
  return `<div class="funnel">` + f.etapas.map((e,i)=>{
    const w = Math.max(2, 100*e.valor/max), dentro = w > 42;
    const lbl = `${e.qtd} negócio(s) · ${compact(e.valor)}`;
    const cor = ramps[Math.min(Math.round(i*(ramps.length-1)/Math.max(1,f.etapas.length-1)),5)];
    return `<div class="frow"><div class="fname">${insight(e.insight)}<span>${esc(e.nome)}</span></div>
      <div class="fbar-track"><div class="fbar" style="width:${w}%;background:${cor}"></div>
      <span class="fbar-lbl" style="${dentro?'left:12px;color:#fff':'left:calc('+w+'% + 12px)'}">${esc(lbl)}</span></div></div>`;
  }).join('') + `</div>`;
}

              {html:loz(c.situacao||'—', TOM_SIT[c.situacao])}],

        ord:{nome:c.nome, ytd:c.ytd},
        attrs:`class="click" data-open="meta" data-i="${i}"`})),
      'Sem metas na planilha.')}</section>`;
  return h;
}
function barra(p){
  if (p==null) return '<span style="color:var(--text-subtlest)">—</span>';
  const w = Math.max(2, Math.min(100, p));
  return `<span class="barrow"><span class="bar"><i style="width:${w}%"></i></span><span class="pct">${pct(p)}</span></span>`;
}

/* ---------------- senha por aba ---------------- */
const hashSenha = s => { let x=5381; for (const ch of s) x=((Math.imul(x,33))^ch.charCodeAt(0))>>>0; return x.toString(16); };
const LOCK_PREFIX = 'pc-unlock-v'+(P.lock_ver||1)+'-';
try {
  const antigas = [];
  for (let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if (k && k.indexOf('pc-unlock-')===0 && k.indexOf(LOCK_PREFIX)!==0) antigas.push(k);
  }
  antigas.forEach(k=>localStorage.removeItem(k));
} catch(e) {}
function estaLiberada(a){
  if (!a.lock) return true;
  try { return localStorage.getItem(LOCK_PREFIX+a.id) === a.lock; } catch(e) { return false; }
}
function telaSenha(a){
  return `<div class="lockwrap"><div class="lockpanel">${ICON.cadeado}
    <h2>Área ${esc(a.nome)}</h2>
    <p>Esta área é protegida. Digite a senha para liberar — ela fica salva neste navegador.</p>
    <form data-lock="${a.id}"><input type="password" inputmode="numeric" autocomplete="off"
      placeholder="••••••" aria-label="Senha da área ${esc(a.nome)}">
      <button class="btn btn-primary" type="submit">Liberar</button></form>
    <div class="lockerr" id="lockerr-${a.id}"></div></div></div>`;
}
document.addEventListener('submit', e=>{
  const f = e.target.closest('form[data-lock]'); if (!f) return;
  e.preventDefault();
  const id = f.dataset.lock, a = P.abas.find(x=>x.id===id);
  const v = f.querySelector('input').value.trim();
  if (hashSenha('desafio|'+id+'|'+v)===a.lock){
    try { localStorage.setItem(LOCK_PREFIX+id, a.lock); } catch(e) {}
    render();
  } else {
    document.getElementById('lockerr-'+id).textContent='Senha incorreta.';
    f.querySelector('input').value=''; f.querySelector('input').focus();
  }
});

function render(){
  const aba = P.abas.find(a=>a.id===estado.aba);
  let titulo, subtitulo, conteudo;
  if (!aba){
    titulo = 'Painel'; subtitulo = 'visão consolidada das representadas liberadas';
    conteudo = viewHome();
  } else if (!estaLiberada(aba)){
    titulo = aba.nome; subtitulo = 'área protegida';
    conteudo = telaSenha(aba);
  } else {
    const sub = aba.subabas.find(s=>s.id===estado.sub) || aba.subabas[0];
    estado.sub = sub.id;
    const tt = TT(aba);
    titulo = aba.nome; subtitulo = TITULOS[sub.tipo] || sub.nome;
    if (sub.tipo==='geral') conteudo = viewGeral(aba, sub, tt);
    else if (sub.tipo==='clientes') conteudo = viewClientes(aba, sub, tt);
    else if (sub.tipo==='produtos') conteudo = viewProdutos(aba, sub, tt);
    else if (sub.tipo==='metas') conteudo = viewMetas(aba, sub, tt);
    else if (sub.tipo==='negociacao') conteudo = viewNegociacao(aba, sub, tt);
  }
  const avisos = (P.sample ? `<div class="banner">${ICON.alerta}<div><b>Dados de exemplo.</b> Painel ainda não conectado ao SuasVendas.</div></div>` : '')
    + (P.avisos||[]).map(a=>`<div class="banner">${ICON.alerta}<div>${esc(a)}</div></div>`).join('');
  app.innerHTML = sidebarHTML() + `<div class="shell">
    <header class="topbar">
      <button class="btn btn-subtle menubtn" id="btnmenu" aria-label="Abrir menu">${ICON.menu}</button>
      <div><h1>${esc(titulo)}</h1><div class="sub">${esc(subtitulo)}</div></div>
      <div class="acoes">
        <button class="btn btn-secondary" id="btnref">${ICON.atualizar}Atualizar dados</button>
      </div>
    </header>
    <main class="content">${avisos}${conteudo}</main></div>`;
  posRender(aba);
}

function posRender(aba){
  // gráfico + seletor de período
  if (aba && estado.sub==='geral'){
    const g = aba.subabas.find(s=>s.tipo==='geral');
    bindChart(aba.id+'-chart', g.trans.meses, aba, 12);
    const seg = document.querySelector(`[data-periodo="${aba.id}"]`);
    if (seg) seg.addEventListener('click', e=>{
      const b = e.target.closest('button'); if (!b) return;
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      const n = +b.dataset.n;
      document.getElementById('chartbox-'+aba.id).innerHTML = chartMeses(g.trans.meses, aba.id+'-chart', n);
      bindChart(aba.id+'-chart', g.trans.meses, aba, n);
    });
  }
  // contadores dos filtros
  document.querySelectorAll('[data-filtros]').forEach(f=>aplicarFiltros(f.dataset.filtros));
  // idade dos dados
  const m = P.atualizado_em.match(/(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})/);
  let horas = null;
  if (m) horas = Math.round((Date.now() - new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]).getTime())/36e5);
  const sb = document.getElementById('staleb');
  if (sb && horas!=null && horas>=26) sb.innerHTML = `<br><span style="color:var(--amber-500)">⚠ há ${horas}h</span>`;
  const br = document.getElementById('btnref');
  if (br) br.onclick = ()=>{
    openModal('Atualizar dados', horas!=null?`Última coleta há ${horas<1?'menos de 1 hora':horas+' hora(s)'}`:'',
      `<p style="font-size:14px;color:var(--text-subtle);margin-top:0;line-height:22px">Os dados vêm da API do SuasVendas por um processo que roda no computador do escritório — esta página, por segurança, não acessa a API diretamente. Para forçar uma coleta agora, use um dos caminhos abaixo e recarregue a página:</p>
      <div class="msec">Opção 1 — atalho na pasta do painel</div>
      <div style="font-size:14px;color:var(--text-subtle);line-height:22px">Dois cliques em <b>Atualizar Painel.command</b> (pasta <span class="mono">Documents/painel-desafio</span>). Ele coleta, recalcula e republica. Leva alguns minutos.</div>
      <div class="msec">Opção 2 — pelo app do Claude</div>
      <div style="font-size:14px;color:var(--text-subtle);line-height:22px">Seção <b>Scheduled</b> → tarefa <b>atualizar-painel-comercial</b> → <b>Run now</b>.</div>
      <div class="msec">Automático</div>
      <div style="font-size:14px;color:var(--text-subtle);line-height:22px">Todo dia às 6h30 a atualização roda sozinha, com o app do Claude aberto.</div>`);
  };
  const bm = document.getElementById('btnmenu');
  if (bm) bm.onclick = ()=>document.getElementById('sidebar').classList.toggle('aberta');
}

document.addEventListener('click', e=>{
  const nav = e.target.closest('[data-nav]');
  if (nav){
    const [a, s] = nav.dataset.nav.split(':');
    estado = { aba:a, sub:s||'geral' };
    closeModal(); render(); window.scrollTo(0,0);
    document.getElementById('sidebar')?.classList.remove('aberta');
    return;
  }
  const tr = e.target.closest('[data-open]');
  if (!tr || e.target.closest('.insb,.info')) return;
  const t = tr.dataset.open;
  if (t==='cliente') openCliente(tr.dataset.aba, tr.dataset.cid);
  else if (t==='meta') openMeta(+tr.dataset.i);
  else if (t==='neg') openNeg(tr.dataset.aba, +tr.dataset.i);
  else if (t==='produto') openProduto(tr.dataset.aba, +tr.dataset.i);
});

render();
</script>
