<style>
/* A identidade é a da página de campanhas que o cliente já conhece. O que entra
   de novo é uma abertura escrita para ele (a faixa navy) e uma faixa "sua conta"
   resumida — uma superfície só, com divisórias, que expande o que ele tocar. */
:root{
  --navy:#0B2B37; --sky:#91CAFF; --ice:#EEF7FF; --terra:#E9D0C4;
  --ink-2:#33505C; --ink-3:#4A5F68; --line:#C6D9E6; --line-2:#D5E3EE; --row:#E3EDF5; --soft:#F5FAFF; --accent:#1D5468;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ice);color:var(--navy)}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--navy)}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 72px;display:flex;flex-direction:column;gap:36px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px;color:var(--ink-3)}
.topo img{height:28px;width:auto;display:block}
.topo a.sair{color:var(--ink-3)}

/* ---- abertura: uma carta curta, não um painel ---- */
.carta{background:var(--navy);color:#fff;border-radius:24px;padding:clamp(28px,5vw,48px);display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.carta::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:var(--sky);opacity:.12;pointer-events:none}
.carta .chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px}
.chip.sky{background:var(--sky);color:var(--navy)}
.carta h1{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(44px,8vw,68px);line-height:1.02;letter-spacing:-.01em}
.carta .lead{margin:0;max-width:34em;font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(19px,2.4vw,24px);line-height:1.4;color:#fff}
.carta .lead b{font-weight:600;color:var(--sky)}
.carta .sub{margin:0;max-width:60ch;font-size:15px;line-height:1.55;color:rgba(255,255,255,.78)}
.carta .cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:999px;padding:12px 20px;font-size:14px;font-weight:600;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.clara{background:var(--sky);color:var(--navy)}
.btn.vazada{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
#stats{display:flex;flex-wrap:wrap;gap:8px}
#stats .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:150px}
#stats .stat span{font-size:12px;color:rgba(255,255,255,.72)}
#stats .stat b{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:600;line-height:1.1}

/* ---- sua conta: trilho lateral de abas e um painel, uma coisa de cada vez ---- */
.conta{background:#fff;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:minmax(220px,280px) 1fr}
.trilho{display:flex;flex-direction:column;border-right:1px solid var(--line-2);background:var(--soft)}
.trilho button{appearance:none;border:0;background:transparent;text-align:left;padding:18px 20px;display:grid;gap:3px;border-left:3px solid transparent;color:var(--navy);min-height:72px}
.trilho button .k{font-size:12px;color:var(--ink-3);font-weight:600}
.trilho button .v{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600;line-height:1.2}
.trilho button .v small{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:12px;font-weight:500;color:var(--ink-2);margin-left:6px}
.trilho button[aria-selected="true"]{background:#fff;border-left-color:var(--navy)}
.trilho button:hover{background:#fff}
.painel{padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-height:280px}
.painel h3{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600}
@media (max-width:899px){
  .conta{grid-template-columns:1fr}
  .trilho{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line-2)}
  .trilho button{flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;min-height:60px;padding:12px 16px}
  .trilho button[aria-selected="true"]{border-bottom-color:var(--navy)}
}
/* metas: barra de atingimento, e "faltam" como convite */
.meta{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--row)}
.meta:first-of-type{border-top:0;padding-top:0}
.meta .cab2{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.meta .cab2 b{font-size:15px}
.meta .cab2 span{font-size:13px;color:var(--ink-3)}
.meta .barra2{height:10px;border-radius:999px;background:var(--row);overflow:hidden}
.meta .barra2 i{display:block;height:100%;background:var(--navy);border-radius:999px}
.meta.ok .barra2 i{background:var(--accent)}
.meta .leg{display:flex;justify-content:space-between;gap:12px;font-size:13px;flex-wrap:wrap}
.meta .leg .falta{font-weight:700}
.meta .leg .premio{color:var(--accent);font-weight:700}
.tri{display:flex;flex-wrap:wrap;gap:8px}
.tri span{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--ink-2)}
.tri span.ok{background:var(--terra);color:var(--navy)}
.tri span.atual{border:1px dashed var(--sky)}
.lista{display:flex;flex-direction:column}
.lin{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--row);font-size:14px}
.lin:first-child{border-top:0}
.lin .d{color:var(--ink-3);font-size:13px;flex:0 0 auto}
.lin .n{flex:1 1 auto;min-width:0}
.lin .r{font-weight:700;white-space:nowrap}
.ped{border-top:1px solid var(--row)}
.ped summary{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px;cursor:pointer;list-style:none;min-height:40px;align-items:center}
.ped summary::-webkit-details-marker{display:none}
.ped ul{margin:0 0 10px;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.ped li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px dashed var(--row)}
.itens{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item .f{height:72px;display:grid;place-items:center;background:#fff;border-radius:8px;overflow:hidden}
.item .f img{max-width:88%;max-height:64px;object-fit:contain}
.item .f span{font-family:'Fraunces',Georgia,serif;font-size:22px;color:var(--line)}
.item .nm{font-size:12px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .q{font-size:12px;color:var(--ink-3)}
.item.camp .nm::after{content:" · em campanha";color:var(--accent);font-weight:600}
.g{width:100%;height:auto;display:block}
.g .b{fill:var(--sky)}.g .b.top{fill:var(--navy)}.g .ax{font-size:10px;fill:var(--ink-3)}.g .vl{font-size:10px;font-weight:700;fill:var(--navy);text-anchor:middle}
.mais{align-self:flex-start}
.pill{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600;min-height:44px}
.pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.nota{font-size:12px;line-height:1.5;color:var(--ink-3)}

/* ---- campanhas: idêntico à página de hoje ---- */
h2{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(28px,4vw,36px)}
h3{margin:0;font-size:16px;font-weight:700}
.barra{position:sticky;top:0;z-index:5;background:var(--ice);padding:12px 0;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rot{font-size:13px;font-weight:600;color:var(--ink-2);margin-right:4px}
.busca{position:relative;flex:1 1 280px;max-width:480px;display:flex;align-items:center}
.busca svg{position:absolute;left:14px}
.busca input{width:100%;min-height:44px;padding:10px 14px 10px 40px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);font:inherit;font-size:14px}
.abas{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.aba{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:44px;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--navy)}
.aba .n{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--terra);color:var(--navy)}
.aba[aria-current="page"]{background:var(--navy);border-color:var(--navy);color:#fff}
.aba[aria-current="page"] .n{background:var(--sky)}
section{display:flex;flex-direction:column;gap:20px}
.cab{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.cab p{margin:0;font-size:15px;line-height:1.5;color:var(--ink-2);max-width:820px}
.faixas{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.faixas span{background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px}
.faixas span.prog{background:var(--sky);color:var(--navy)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.foto{position:relative;height:160px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.foto img{max-width:88%;max-height:140px;object-fit:contain}
.foto .vazia{font-size:12px;color:var(--ink-3)}
.selo{position:absolute;top:10px;left:10px;background:var(--terra);color:var(--navy);font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.selo.dir{left:auto;right:10px;background:var(--navy);color:#fff}
.info{display:flex;flex-direction:column;gap:4px}
.cat{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.nome{font-size:15px;font-weight:700;line-height:1.3}
.meta{font-size:12px;color:var(--ink-3)}
.preco{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line-2);padding-top:10px}
.preco span{font-size:12px;color:var(--ink-3)}
.preco b{font-size:15px;font-weight:600}
.tiers{display:flex;flex-direction:column;gap:6px}
.tier{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 10px}
.tier .pct{background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;min-width:44px;text-align:center}
.tier .q{font-size:12px;color:var(--ink-2);flex-grow:1;display:flex;flex-direction:column}
.tier .q small{font-size:11px;color:var(--ink-3)}
.tier b{font-size:15px;font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tgrid div{background:var(--soft);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;align-items:center}
.tgrid span{font-size:11px;font-weight:700;color:var(--accent)}
.tgrid b{font-size:14px;font-weight:700}
.mini{background:#fff;border:1px dashed var(--sky);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center}
.mini .f{width:72px;height:72px;flex-shrink:0;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.mini .f img{max-width:64px;max-height:64px;object-fit:contain}
.mini .t{font-size:12px;color:var(--accent);font-weight:600}
.caixa{background:#fff;border-radius:16px;padding:8px 8px 12px;display:flex;flex-direction:column;gap:4px}
.caixa.trac{border:1px dashed var(--sky)}
.caixa h3{margin:12px 12px 4px}
.rolar{overflow-x:auto}
.tab{min-width:820px;display:flex;flex-direction:column}
.tr{display:flex;gap:12px;padding:10px 12px;border-bottom:1px solid var(--row);font-size:13px;align-items:center}
.tr.th{background:var(--soft);border-radius:10px;border:0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.c-img{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.c-img img{max-width:44px;max-height:44px;object-fit:contain}
.c-cod{width:110px;flex-shrink:0;color:var(--ink-3)}
.c-nome{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.c-nome small{font-size:11px;color:var(--accent);font-weight:600}
.c-n{width:92px;flex-shrink:0;text-align:right}
.c-t{width:84px;flex-shrink:0;text-align:right;font-weight:600}
.aviso{background:#fff;border-radius:16px;padding:20px;font-size:14px;line-height:1.5;color:var(--ink-2)}
footer{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:1.6;color:var(--ink-3)}
@media (max-width:640px){.barra{position:static}}
@media (prefers-reduced-motion:reduce){.conta summary .seta{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

      <div class="nota">Apurado pela 3M${m.atualizado ? ', com dados até ' + esc(m.atualizado) : ''}. O trimestre em andamento ainda vai somar os pedidos que entrarem — em campanha, cada pedido conta duas vezes: no desconto e na meta.</div>`;
  }
  if (id === 'pedidos') {
    const peds = D.pedidos.map((p) => `<details class="ped"><summary><span>${esc(p.data)} <span style="color:var(--ink-3)">· ${p.itens.length} ${p.itens.length === 1 ? 'item' : 'itens'}</span></span><b>${brl(p.valor)}</b></summary>
      <ul>${p.itens.map((i) => `<li><span>${esc(i.nome)}</span><span>${qtd(i.qtd, i.unidade)}</span></li>`).join('')}</ul></details>`).join('');
    return `<h3>Seus últimos pedidos</h3><div class="lista">${peds || '<div class="nota">Ainda não há pedidos registrados.</div>'}</div><div class="nota">Os últimos 10. Toque num pedido para ver os itens.</div>`;
  }
  if (id === 'itens') {
    const top = h.top.slice(0, 8).map((i) => { const f = fotoDe[i.codigo]; return `<div class="item${f ? ' camp' : ''}"><div class="f">${f ? `<img src="${esc(f)}" alt="" loading="lazy">` : `<span>${esc((i.nome || '?').slice(0, 1))}</span>`}</div><div class="nm">${esc(i.nome)}</div><div class="q">${qtd(i.qtd, i.unidade)} em ${i.pedidos} ${i.pedidos === 1 ? 'pedido' : 'pedidos'}</div></div>`; }).join('');
    return `<h3>O que vocês mais compram</h3><div class="itens">${top || '<div class="nota">Sem compras nos últimos 12 meses.</div>'}</div><div class="nota">Pelos pedidos dos últimos 12 meses. Item marcado "em campanha" tem desconto este mês — veja abaixo.</div>`;
  }
  return `<h3>Suas compras, mês a mês</h3>${barras(h.meses.slice(-12), h.melhor_mes)}<div class="nota">Valor dos pedidos nos últimos 12 meses.</div>`;
}
function conta() {
  const e = entradas();
  if (!e.some((x) => x.id === ui.aba)) ui.aba = e[0].id;
  $('conta').innerHTML = `<div class="trilho" role="tablist">${e.map((x) => `<button type="button" role="tab" aria-selected="${ui.aba === x.id}" data-ui="${x.id}"><span class="k">${esc(x.k)}</span><span class="v">${esc(x.v)}${x.s ? `<small>${esc(x.s)}</small>` : ''}</span></button>`).join('')}</div>
    <div class="painel" role="tabpanel">${painel(ui.aba)}</div>`;
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-ui]'); if (b) { ui.aba = b.dataset.ui; conta(); } });
function barras(meses, melhor) {
  const topo = Math.max(...meses.map((m) => m.valor), 1) * 1.2;
  const W = 640, H = 170, mb = 22, mt = 16, passo = W / meses.length, bw = passo * .62;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="g" role="img" aria-label="Compras por mês">`;
  meses.forEach((m, i) => { const h = (H - mt - mb) * m.valor / topo, x = passo * i + (passo - bw) / 2, y = H - mb - h;
    const top = melhor && m.label === melhor.label;
    if (m.valor > 0) s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" class="b${top ? ' top' : ''}"/>${top ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" class="vl">${esc(compact(m.valor).replace('R$ ', ''))}</text>` : ''}`;
    s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" class="ax" text-anchor="middle">${esc(m.label.slice(0, 3))}</text>`; });
  return s + '</svg>';
}

/* ---------- campanhas: o mesmo renderizador da página de campanhas ---------- */
(function () {
  const BASE = D.campanha ? D.campanha.url : null;
  const NOME = D.nome;
  const st = { d: null, sort: 'volume', cats: {}, shown: {}, tab: 'seg', q: '' };
  const ORDENS = [['volume', 'Volume de compras'], ['alfabetica', 'Alfabética'], ['desconto', 'Maior desconto'], ['recencia', 'Compra mais recente']];
  const handlers = {}; let hid = 0;
  const on = (fn) => { const k = 'h' + (hid++); handlers[k] = fn; return k; };
  function ordenar(lista) {
    const nome = (a, b) => a.nome.localeCompare(b.nome, 'pt-BR');
    const by = { volume: (a, b) => (b.valor - a.valor) || nome(a, b), alfabetica: nome,
      desconto: (a, b) => (b.max_pct - a.max_pct) || (b.valor - a.valor) || nome(a, b),
      recencia: (a, b) => (b.ultima || '').localeCompare(a.ultima || '') || nome(a, b) }[st.sort];
    return lista.slice().sort(by);
  }
  const filtrar = (key, itens) => { const c = st.cats[key] || 'Todas'; return itens.filter((x) => c === 'Todas' || x.cat === c); };
  function chips(key, cats, itens) {
    const atual = st.cats[key] || 'Todas';
    const conta = (c) => itens.filter((x) => c === 'Todas' || x.cat === c).length;
    const ops = ['Todas'].concat(cats).filter((c) => conta(c) > 0);
    if (ops.length < 3) return '';
    return '<div class="linha" role="group" aria-label="Categorias">' + ops.map((c) => `<button type="button" class="pill" aria-pressed="${atual === c}" data-h="${on(() => { st.cats[key] = c; st.shown = {}; render(); })}">${esc(c)} · ${conta(c)}</button>`).join('') + '</div>';
  }
  function paginar(key, lista) {
    const n = st.shown[key] || 5, faltam = Math.max(lista.length - n, 0);
    const btn = faltam > 0 ? `<div class="linha"><button type="button" class="btn" data-h="${on(() => { st.shown[key] = n + 10; render(); })}">Ver mais ${Math.min(10, faltam)} · faltam ${faltam}</button></div>` : '';
    return { rows: lista.slice(0, n), btn };
  }
  const foto = (x, cls) => x.foto ? `<img src="${esc(x.foto)}" alt="${esc(x.nome)}" loading="lazy">` : (cls === 'grande' ? '<span class="vazia">Sem foto</span>' : '');
  function tierLinhas(x, unidade) {
    return '<div class="tiers">' + x.tiers.map((t) => `<div class="tier"><span class="pct">−${esc(t.pct_txt)}</span><span class="q"><span>a partir de ${esc(t.min_txt)} ${esc(unidade)}</span>${t.detalhe ? `<small>${esc(t.detalhe)}</small>` : ''}</span><b>${esc(t.preco_txt)}</b></div>`).join('') + '</div>';
  }
  function cardItem(x, opts) {
    const comprado = x.comprado;
    const meta = esc(x.codigo) + (comprado ? ` · ${esc(x.qtd_txt)} ${esc(x.unidade)} comprados · último em ${esc(x.ultima_txt)}` : '');
    const corpo = opts.grade ? '<div class="tgrid">' + x.tiers.map((t) => `<div><span>−${esc(t.pct_txt)}</span><b>${esc(t.preco_txt)}</b></div>`).join('') + '</div>' : tierLinhas(x, opts.unidade || x.unidade);
    return `<article class="card"><div class="foto">${foto(x, 'grande')}${comprado ? '<span class="selo">Já comprado</span>' : ''}${x.somada ? '<span class="selo dir">2 campanhas</span>' : ''}</div>
      <div class="info"><span class="cat">${esc(opts.campanha ? opts.campanha + ' · ' + x.cat : x.cat)}</span><span class="nome">${esc(x.nome)}</span><span class="meta">${meta}</span></div>
      <div class="preco"><span>Tabela SDA</span><b>${esc(x.preco_txt)}</b></div>${corpo}
      ${x.somada ? `<span class="nota">Desconto somado de duas campanhas da 3M.${x.depois_txt ? ' ' + esc(x.depois_txt) + '.' : ''}</span>` : ''}
      ${!opts.grade && x.validade_txt ? `<span class="nota">Válida até ${esc(x.validade_txt)}</span>` : ''}
      ${opts.abrir ? `<button type="button" class="pill" data-h="${opts.abrir}">Abrir ${esc(opts.campanha)}</button>` : ''}</article>`;
  }
  function tabela(s, rows, similares) {
    const th = s.tiers.map((t) => `<span class="c-t">−${esc(t.pct_txt)}</span>`).join('');
    const head = `<div class="tr th">${similares ? '<span class="c-img"></span>' : ''}<span class="c-cod">Código</span><span class="c-nome">Produto</span>${similares ? '' : '<span class="c-n">Comprado</span><span class="c-n">Último</span>'}<span class="c-n">Tabela SDA</span>${th}</div>`;
    const body = rows.map((r) => `<div class="tr">${similares ? `<span class="c-img">${foto(r)}</span>` : ''}<span class="c-cod">${esc(r.codigo)}</span><span class="c-nome"><span>${esc(r.nome)}</span><small>${esc(r.cat)}</small></span>${similares ? '' : `<span class="c-n meta">${esc(r.qtd_txt)} ${esc(r.unidade)}</span><span class="c-n meta">${esc(r.ultima_txt)}</span>`}<span class="c-n">${esc(r.preco_txt)}</span>${r.tiers.map((t) => `<span class="c-t">${esc(t.preco_txt)}</span>`).join('')}</div>`).join('');
    return `<div class="rolar"><div class="tab">${head}${body}</div></div>`;
  }
  function secaoSeg(d) {
    const cards = ordenar(filtrar('seg', d.seguranca));
    const sim = paginar('seg-sim', ordenar(filtrar('seg', d.similares_seg)));
    const nSim = filtrar('seg', d.similares_seg).length;
    return `<section><div class="cab"><span class="eyebrow">Promoções por item · segurança e empacotamento</span><h2>Os itens que vocês mais compram, com desconto próprio</h2><p>Cada item tem a sua própria faixa: o desconto vale a partir da quantidade indicada, no mesmo pedido.</p></div>
      ${chips('seg', d.cats.seg, d.seguranca.concat(d.similares_seg))}
      ${cards.length ? `<div class="grade">${cards.map((x) => cardItem(x, {})).join('')}</div>` : '<div class="aviso">Nenhum item já comprado nesta categoria.</div>'}
      ${nSim ? `<div style="display:flex;flex-direction:column;gap:12px"><h3 style="font-size:18px">Da mesma linha, também em campanha (${nSim})</h3><div class="grade">${sim.rows.map((x) => `<article class="mini"><div class="f">${foto(x)}</div><div class="info" style="min-width:0"><span class="cat">${esc(x.cat)}</span><span class="nome" style="font-size:14px">${esc(x.nome)}</span><span class="meta">${esc(x.codigo)} · tabela ${esc(x.preco_txt)}</span><span class="t">${esc(x.tiers_resumo)}</span>${x.validade_txt ? `<span class="meta">Válida até ${esc(x.validade_txt)}</span>` : ''}</div></article>`).join('')}</div>${sim.btn}</div>` : ''}</section>`;
  }
  function secaoSort(s, d) {
    const comprados = ordenar(filtrar(s.key, s.itens.filter((x) => x.comprado)));
    const similares = ordenar(filtrar(s.key, s.itens.filter((x) => !x.comprado)));
    const outros = paginar(s.key + '-outros', comprados.slice(12));
    const sim = paginar(s.key + '-sim', similares);
    const faixas = s.tiers.map((t) => `<span>${esc(t.min_txt)}+ un no mix · −${esc(t.pct_txt)}${t.detalhe ? ' (' + esc(t.detalhe) + ')' : ''}</span>`).join('') + (s.programacao ? '<span class="prog">Aceita programação</span>' : '');
    return `<section><div class="cab"><span class="eyebrow">${esc(s.divisao_txt)} · sortimento</span><h2>${esc(s.promo)}</h2>
        <p>Some a quantidade de qualquer item da lista no mesmo pedido: a faixa atingida vale para todos. Vocês já compraram ${s.n_comprados} dos ${s.n_total} itens (${esc(s.valor_txt)} no histórico).${s.validade_txt ? ` Válida até ${esc(s.validade_txt)}.` : ''}</p>
        <div class="faixas">${faixas}</div></div>
      ${chips(s.key, d.cats[s.key] || [], s.itens)}
      ${comprados.length ? `<div class="grade">${comprados.slice(0, 12).map((x) => cardItem(x, { grade: true })).join('')}</div>` : '<div class="aviso">Nenhum item já comprado nesta categoria.</div>'}
      ${comprados.length > 12 ? `<div class="caixa"><h3>Outros ${comprados.length - 12} itens que vocês já compram nesta campanha</h3>${tabela(s, outros.rows, false)}${outros.btn}</div>` : ''}
      ${similares.length ? `<div class="caixa trac"><h3>${similares.length} itens da mesma linha que vocês ainda não compram</h3>${tabela(s, sim.rows, true)}${sim.btn}</div>` : ''}</section>`;
  }
  function secaoBusca(d, termo) {
    const semEsp = termo.replace(/\s/g, ''), todos = [];
    d.seguranca.concat(d.similares_seg).forEach((x) => todos.push({ x, campanha: 'Promoções por item', key: 'seg', unidade: x.unidade }));
    d.sortimentos.forEach((s) => s.itens.forEach((x) => todos.push({ x, campanha: s.promo.replace(/^Sortimento\s+/i, ''), key: s.key, unidade: 'un no mix' })));
    const achados = todos.filter((o) => o.x.codigo.toUpperCase().includes(semEsp) || o.x.nome.toUpperCase().includes(termo));
    const ord = ordenar(achados.map((o) => Object.assign({}, o.x, { _o: o }))).sort((a, b) => (b.codigo.toUpperCase() === semEsp) - (a.codigo.toUpperCase() === semEsp));
    const pg = paginar('busca', ord);
    return `<section><div class="cab"><span class="eyebrow">Pesquisa em todas as campanhas</span><h2>${ord.length === 1 ? '1 item encontrado' : ord.length + ' itens encontrados'}</h2></div>
      ${ord.length ? '' : '<div class="aviso">Nenhum item em campanha neste mês com esse código ou nome. Confira o código ou tente só uma parte dele.</div>'}
      <div class="grade">${pg.rows.map((x) => cardItem(x, { campanha: x._o.campanha, unidade: x._o.unidade, abrir: on(() => { st.tab = x._o.key; st.q = ''; $('busca').value = ''; st.shown = {}; render(); window.scrollTo({ top: $('abas').getBoundingClientRect().top + window.scrollY - 120 }); }) })).join('')}</div>${pg.btn}</section>`;
  }
  function render() {
    const d = st.d; if (!d) return;
    for (const k in handlers) delete handlers[k]; hid = 0;
    const s = d.stats;
    $('stats').innerHTML = `<div class="stat"><span>itens que vocês já compram, em campanha</span><b>${esc(s.comprados)}</b></div>
      <div class="stat"><span>desconto máximo, somando campanhas</span><b>${esc(s.max_pct)}</b></div>
      <div class="stat"><span>itens da mesma linha em promoção</span><b>${esc(s.similares)}</b></div>`;
    const termo = st.q.trim().toUpperCase().replace(/\s+/g, ' ');
    const tabs = [{ key: 'seg', label: 'Promoções por item', n: d.seguranca.length }].concat(d.sortimentos.map((x) => ({ key: x.key, label: x.promo.replace(/^Sortimento\s+/i, ''), n: x.n_comprados })));
    $('abas').innerHTML = tabs.map((t) => `<button type="button" class="aba" aria-current="${!termo && t.key === st.tab ? 'page' : 'false'}" data-h="${on(() => { st.tab = t.key; st.q = ''; $('busca').value = ''; st.shown = {}; render(); })}">${esc(t.label)}<span class="n">${t.n}</span></button>`).join('');
    $('ordens').innerHTML = ORDENS.map(([k, l]) => `<button type="button" class="pill" aria-pressed="${st.sort === k}" data-h="${on(() => { st.sort = k; st.shown = {}; render(); })}">${l}</button>`).join('');
    $('limpar').hidden = !termo;
    let html;
    if (termo) html = secaoBusca(d, termo); else if (st.tab === 'seg') html = secaoSeg(d); else html = secaoSort(d.sortimentos.find((x) => x.key === st.tab) || d.sortimentos[0], d);
    $('conteudo').innerHTML = html;
  }
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-h]'); if (b && handlers[b.dataset.h]) handlers[b.dataset.h](); });
  $('busca').addEventListener('input', (e) => { st.q = e.target.value; st.shown = {}; render(); });
  $('limpar').addEventListener('click', () => { st.q = ''; $('busca').value = ''; st.shown = {}; render(); $('busca').focus(); });

  carta(); conta();
  $('quando').textContent = D.atualizado_em;
  $('rodape').innerHTML = `<span>Campanhas: campanhas 3M vigentes aplicadas à tabela SDA Revenda${D.campanha ? ', conferidas em ' + esc(D.campanha.atualizado) : ''}. Preço com desconto = tabela × (1 − soma dos % das campanhas do item), sem rebate, IPI ou ST.</span>
    <span>Pedidos e histórico: o nosso sistema, sincronizado em ${esc(D.sync_em)}. Só pedidos; orçamentos, cancelados e excluídos ficam de fora.</span>
    <span>Dúvidas ou um pedido novo? <a href="mailto:contato@desafiorp.com.br">contato@desafiorp.com.br</a>. Desafio Representações.</span>`;
  if (!BASE) { $('barra').hidden = true; $('conteudo').innerHTML = '<div class="aviso">Sem campanha publicada neste mês. Assim que a 3M abrir a próxima, ela aparece aqui.</div>'; return; }
  fetch(BASE + 'dados.json').then((r) => r.json()).then((d) => {
    st.d = d;
    d.seguranca.concat(d.similares_seg || []).forEach((x) => { if (x.foto) fotoDe[x.codigo] = x.foto; });
    (d.sortimentos || []).forEach((s) => s.itens.forEach((x) => { if (x.foto) fotoDe[x.codigo] = x.foto; }));
    conta(); render();
  }).catch(() => { $('conteudo').innerHTML = '<div class="aviso">Não foi possível carregar as campanhas. Atualize a página.</div>'; });
})();
</script>
