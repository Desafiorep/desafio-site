const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => v == null ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits: 0, maximumFractionDigits: 0});
const compact = v => { if (v == null) return '—'; const a = Math.abs(v); if (a >= 1e6) return 'R$ ' + (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mi'; if (a >= 1e3) return 'R$ ' + Math.round(v/1e3).toLocaleString('pt-BR') + ' mil'; return brl(v); };
const qtd = (q, u) => (Number(q) % 1 ? Number(q).toLocaleString('pt-BR',{maximumFractionDigits:2}) : Number(q).toLocaleString('pt-BR')) + ' ' + esc(u || 'un');
const delta = (v, rot) => v == null ? '' : `<span class="d ${v >= 0 ? 'p' : 'm'}">${v >= 0 ? '▲' : '▼'} ${Math.abs(v).toLocaleString('pt-BR',{maximumFractionDigits:0})}% ${esc(rot)}</span>`;
const loz = s => `<span class="loz ${/Faturado|Atendido/.test(s) ? 'ok' : (/análise|Andamento/.test(s) ? 'at' : '')}">${esc(s)}</span>`;
const st = { aba: 'pedidos', mostrar: {} };

function kpis(){
  const k = D.kpis, c = k.campanha;
  const ult = k.ultimo;
  const gancho = c
    ? `<div class="kpi gancho"><div class="l">Campanha do mês</div><div class="v">${esc(c.max_pct || '—')}</div><div class="r">de desconto máximo · ${c.comprados != null ? c.comprados + ' itens que você já compra em campanha' : 'veja os itens'} · <a href="#" data-aba="campanha">ver campanhas</a></div></div>`
    : (D.historico.parou.length
       ? `<div class="kpi gancho"><div class="l">Vale voltar</div><div class="v">${D.historico.parou.length} itens</div><div class="r">que você comprava e não pediu nos últimos 12 meses · <a href="#" data-aba="historico">ver quais</a></div></div>`
       : `<div class="kpi"><div class="l">Orçamentos recentes</div><div class="v">${k.orcamentos_recentes}</div><div class="r">nos últimos 90 dias · <a href="#" data-aba="orcamentos">ver</a></div></div>`);
  $('kpis').innerHTML = `
    <div class="kpi"><div class="l">Suas compras em ${k.ano}</div><div class="v">${compact(k.ano_valor)}</div>
      <div class="r">${k.ano_pedidos} pedido(s) ${k.ano_yoy != null ? '· ' + delta(k.ano_yoy, 'vs mesmo período de ' + (k.ano-1)) : ''}</div></div>
    <div class="kpi"><div class="l">Último pedido</div><div class="v">${ult ? esc(ult.data) : '—'}</div>
      <div class="r">${ult ? `${loz(ult.situacao)} · ${compact(ult.valor)}` : 'nenhum pedido registrado'}${k.abertos.n ? ` · ${k.abertos.n} em aberto (${compact(k.abertos.valor)})` : ''}</div></div>
    ${gancho}`;
}

function linhaPedido(p, comValor){
  const its = p.itens.map(i => `<li><span>${esc(i.nome)} <span class="s">${esc(i.codigo)}</span></span><span>${qtd(i.qtd, i.unidade)}</span></li>`).join('');
  return `<tr class="click" data-toggle><td>${esc(p.data)}<br><span class="s">nº ${esc(p.id)}</span></td>
    <td>${p.itens.length} item(ns)<ul class="itens">${its}</ul></td>
    ${p.situacao ? `<td>${loz(p.situacao)}</td>` : ''}${comValor ? `<td class="n">${brl(p.valor)}</td>` : ''}</tr>`;
}

function lista(key, itens, render, cab){
  const n = st.mostrar[key] || 10;
  const vis = itens.slice(0, n);
  const btn = itens.length > n ? `<div class="mais"><button class="btn" data-mais="${key}">Ver mais (${itens.length - n})</button></div>` : '';
  return itens.length ? `<table><thead><tr>${cab}</tr></thead><tbody>${vis.map(render).join('')}</tbody></table>${btn}` : '<div class="vazio">Nada por aqui ainda.</div>';
}

function barras(meses){
  const topo = Math.max(...meses.map(m => m.valor), 1) * 1.15;
  const W = 980, H = 220, ml = 50, mb = 36, mt = 14, gl = W - ml - 8, ga = H - mt - mb, passo = gl / meses.length, bw = passo * .6;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="g" role="img" aria-label="Compras por mês">`;
  for (let i = 0; i <= 4; i++){ const y = mt + ga - ga * i / 4; s += `<line x1="${ml}" y1="${y}" x2="${W-8}" y2="${y}" class="grid"/><text x="${ml-6}" y="${y+3}" class="ax" text-anchor="end">${compact(topo*i/4).replace('R$ ','')}</text>`; }
  meses.forEach((m, i) => { const h = ga * m.valor / topo, x = ml + passo * i + (passo - bw) / 2;
    if (m.valor > 0) s += `<rect x="${x}" y="${mt+ga-h}" width="${bw}" height="${h}" class="c1" rx="2"/><text x="${x+bw/2}" y="${mt+ga-h-4}" class="vl">${compact(m.valor).replace('R$ ','')}</text>`;
    if (i % 2 === 1 || meses.length <= 12) s += `<text x="${x+bw/2}" y="${H-mb+16}" class="ax" text-anchor="middle">${esc(m.label)}</text>`; });
  return s + '</svg>';
}

function secao(){
  if (st.aba === 'pedidos') return `<section class="card"><h2>Seus pedidos</h2><p>Os mais recentes primeiro. Toque num pedido para ver os itens.</p>
    ${lista('ped', D.pedidos, p => linhaPedido(p, true), '<th>Data</th><th>Itens</th><th>Situação</th><th class="n">Valor</th>')}</section>`;
  if (st.aba === 'orcamentos') return `<section class="card"><h2>Seus orçamentos</h2><p>O que você pediu para cotar, do mais recente para o mais antigo. Para fechar algum, fale com a gente.</p>
    ${lista('orc', D.orcamentos, p => linhaPedido(p, false), '<th>Data</th><th>Itens</th>')}</section>`;
  if (st.aba === 'historico'){
    const h = D.historico;
    return `<section class="card"><h2>Suas compras mês a mês</h2><p>Últimos 24 meses, em valor de pedido.</p>${barras(h.meses)}</section>
    <section class="card"><h2>O que você mais compra</h2><p>Últimos 12 meses.</p>
      ${lista('top', h.top, i => `<tr><td>${esc(i.nome)}<br><span class="s">${esc(i.codigo)}</span></td><td class="n">${qtd(i.qtd, i.unidade)}</td><td class="n">${i.pedidos}</td><td>${esc(i.ultima || '—')}</td></tr>`, '<th>Item</th><th class="n">Quantidade</th><th class="n">Pedidos</th><th>Último</th>')}</section>
    ${h.parou.length ? `<section class="card"><h2>Comprava e parou</h2><p>Itens que você pedia e não aparecem nos últimos 12 meses. Se faltar, é só pedir.</p>
      ${lista('parou', h.parou, i => `<tr><td>${esc(i.nome)}<br><span class="s">${esc(i.codigo)}</span></td><td class="n">${qtd(i.qtd, i.unidade)}</td><td>${esc(i.ultima || '—')}</td></tr>`, '<th>Item</th><th class="n">Comprava</th><th>Último pedido</th>')}</section>` : ''}`;
  }
  if (st.aba === 'campanha'){
    const c = D.campanha;
    return c ? `<div class="nota">Campanhas atualizadas em <b>${esc(c.atualizado)}</b>. <a href="${esc(c.url)}" target="_blank">Abrir em tela cheia</a></div><iframe class="camp" src="${esc(c.url)}" title="Campanhas 3M" loading="lazy"></iframe>`
             : '<div class="vazio">Sem campanha publicada neste mês.</div>';
  }
}

function render(){
  const abas = [['pedidos','Pedidos'],['orcamentos','Orçamentos'],['historico','Histórico']].concat(D.campanha ? [['campanha','Campanhas']] : []);
  $('abas').innerHTML = abas.map(([k,l]) => `<button class="aba" aria-current="${st.aba===k?'page':'false'}" data-aba="${k}">${l}</button>`).join('');
  $('conteudo').innerHTML = secao();
}

$('quem').innerHTML = `<b>${esc(D.nome)}</b>seu painel 3M · atualizado ${esc(D.atualizado_em)}`;
$('rodape').innerHTML = `Pedidos e orçamentos vêm do nosso sistema, sincronizado em ${esc(D.sync_em)} — o painel se atualiza duas vezes por dia.<br>Dúvidas ou um pedido novo? <a href="mailto:contato@desafiorp.com.br">contato@desafiorp.com.br</a> · <a href="/clientes/entrar?sair=1&c=${esc(D.slug)}">sair</a>`;
kpis(); render();
document.addEventListener('click', e => {
  const a = e.target.closest('[data-aba]'); if (a){ e.preventDefault(); st.aba = a.dataset.aba; render(); window.scrollTo({top: $('abas').offsetTop - 12, behavior: 'smooth'}); return; }
  const m = e.target.closest('[data-mais]'); if (m){ st.mostrar[m.dataset.mais] = (st.mostrar[m.dataset.mais] || 10) + 10; render(); return; }
  const t = e.target.closest('tr[data-toggle]'); if (t) t.classList.toggle('aberto');
});
</script>
</body>
</html>
